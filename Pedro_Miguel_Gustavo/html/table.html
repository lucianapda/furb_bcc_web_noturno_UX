<h2>Minhas Tarefas</h2>
<div id="table-container">
    <table id="tasks-table">
        <thead>
            <tr>
                <th class="checkbox-column">
                    <input type="checkbox">
                </th>

                <th title="Titulo">Titulo</th>
                <th title="Descrição">Descrição</th>
                <th title="Categoria">Categoria</th>

                <th class="priority-header" title="Prioridade">Prioridade
                    <span class="sort-arrow">↑</span>
                </th>
                <th title="Ações">Ações</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <div id="pagination-bar">
        <div class="rows-wrapper">
            <span>Linhas por página</span>
            <select class="rows-box">
                <option selected>10</option>
                <option>25</option>
                <option>50</option>
                <option>100</option>
            </select>
        </div>

        <span class="page-counter">1-10 de 100</span>

        <div class="pagination-buttons">
            <button>⏮</button>
            <button>◀</button>
            <button>▶</button>
            <button>⏭</button>
        </div>
    </div>
</div>
